name: Evaluate prompt changes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prompts/**"
      - "data/golden/**"
      - "src/regression_detection/**"
      - "pyproject.toml"

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run offline contract tests
        run: pytest

      - name: Install Ollama
        shell: bash
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull evaluation model
        shell: bash
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 2
          done
          ollama pull qwen2.5vl:3b

      - name: Evaluate prompt with Ollama
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m regression_detection.cli \
            --provider ollama \
            --model qwen2.5vl:3b \
            --prompt prompts/v1.yaml \
            --dataset data/golden/v1.json \
            --db eval_runs/history.sqlite \
            --report reports/evaluation.html \
            --summary-file reports/evaluation.md \
            --output-run reports/evaluation.json \
            --baseline data/baselines/v1.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-report
          path: reports/

      - name: Comment report status on pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body-file reports/evaluation.md
